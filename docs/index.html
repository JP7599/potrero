<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POTRERO — del barrio a la gloria</title>
<meta name="description" content="Modo carrera de fútbol: eliges tu país, empiezas en la última categoría y llegas donde alcances. Clubes reales, sin instalación, sin cuenta y sin internet.">
<meta name="theme-color" content="#0a7c42">
<style>
  /* POTRERO — interfaz.
   *
   * Una sola columna, una decisión por pantalla, navegación abajo al alcance
   * del pulgar. El teléfono manda: en pantalla grande es la misma columna
   * centrada con la navegación arriba, no un tablero distinto. Nada de
   * adornos; el color se usa para decir algo (verde bien, rojo mal) y nunca
   * para decorar. */
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #f2f4f6;
    --card: #ffffff;
    --card2: #f7f8fa;
    --texto: #14171c;
    --tenue: #67707d;
    --linea: #e3e6ea;
    --verde: #0a7c42;
    --verde-suave: #e7f4ed;
    --rojo: #c62f22;
    --rojo-suave: #fdeceb;
    --ambar: #a86008;
    --ambar-suave: #fdf1e0;
    --sombra: 0 1px 2px rgba(16,20,26,.06), 0 4px 14px rgba(16,20,26,.05);
    --radio: 14px;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --num: ui-monospace, SFMono-Regular, Menlo, monospace;
    --nav-h: 60px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b21; --card2: #1e232b; --texto: #e9ecf1;
      --tenue: #98a2b0; --linea: #272d36;
      --verde: #35c47c; --verde-suave: #14311f;
      --rojo: #ff6b60; --rojo-suave: #351a17;
      --ambar: #f0b354; --ambar-suave: #33260f;
      --sombra: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font-family: var(--ui); font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  }
  .app { max-width: 560px; margin: 0 auto; padding: 0 14px; }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; }
  .tenue { color: var(--tenue); }

  /* ------------------------------------------------------------ cabecera */
  .top {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: 10px 0 8px; border-bottom: 1px solid var(--linea);
  }
  .top .fila { display: flex; align-items: center; gap: 10px; }
  .camiseta { width: 34px; height: 34px; flex: none; display: block; }
  .camiseta.mini { width: 22px; height: 22px; }
  .camiseta.grande { width: 60px; height: 60px; }
  .top .quien { min-width: 0; flex: 1; }
  .top .club { font-weight: 650; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .liga { font-size: 12px; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .plata { font-family: var(--num); font-weight: 700; font-size: 15px; color: var(--verde); }
  .barra-temp { height: 3px; background: var(--linea); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .barra-temp i { display: block; height: 100%; background: var(--verde); border-radius: 3px; }
  .semana { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--tenue); margin-top: 5px; }

  /* -------------------------------------------------------------- piezas */
  .card {
    background: var(--card); border-radius: var(--radio); box-shadow: var(--sombra);
    padding: 16px; margin: 12px 0;
  }
  .card.plano { box-shadow: none; border: 1px solid var(--linea); }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
  h2 { font-size: 13px; margin: 0 0 10px; font-weight: 650; color: var(--tenue); letter-spacing: .02em; }
  p { margin: 0 0 12px; }
  .texto { color: var(--texto); }
  .sep { height: 1px; background: var(--linea); margin: 14px 0; }

  button {
    font: inherit; color: inherit; background: none; border: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px;
    margin-bottom: 8px; font-weight: 600; transition: background .12s, border-color .12s, transform .06s;
    min-height: 52px;
  }
  .btn:hover { border-color: var(--verde); background: var(--verde-suave); }
  .btn:active { transform: scale(.988); }
  .btn .sub { display: block; font-weight: 400; font-size: 13.5px; color: var(--tenue); margin-top: 3px; line-height: 1.35; }
  .btn.primario {
    background: var(--verde); color: #fff; border-color: var(--verde);
    text-align: center; font-size: 17px; font-weight: 650;
  }
  .btn.primario:hover { filter: brightness(1.07); background: var(--verde); }
  .btn.chico { padding: 9px 12px; min-height: 0; font-size: 14px; margin-bottom: 0; width: auto; display: inline-block; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    border: 1px solid var(--linea); background: var(--card); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; font-weight: 550; min-height: 40px;
  }
  .pill.on { background: var(--verde); border-color: var(--verde); color: #fff; }

  input {
    font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--linea); background: var(--card); color: var(--texto);
  }
  input:focus { outline: 2px solid var(--verde); outline-offset: -1px; border-color: transparent; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--tenue); margin: 16px 0 7px; }

  /* ------------------------------------------------------------ decisión */
  .opcion { position: relative; }
  .opcion .prob {
    float: right; font-family: var(--num); font-size: 13px; color: var(--verde);
    font-weight: 700; margin-left: 10px;
  }

  /* ------------------------------------------------------------ marcador */
  .marcador { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; }
  .marcador .lado { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
  .marcador .nom { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
  .marcador .goles { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-family: var(--num); }
  .marcador .vs { font-size: 12px; color: var(--tenue); }
  .gano { color: var(--verde); } .perdio { color: var(--rojo); }
  .nota { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .nota b {
    font-family: var(--num); font-size: 22px; padding: 4px 10px; border-radius: 10px;
    background: var(--card2);
  }
  .nota b.buena { background: var(--verde-suave); color: var(--verde); }
  .nota b.mala { background: var(--rojo-suave); color: var(--rojo); }
  .cab-temp { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .laurel { display: grid; gap: 6px; margin-bottom: 14px; }
  .laurel div {
    background: var(--verde-suave); color: var(--verde); border-radius: 10px;
    padding: 9px 12px; font-weight: 700; font-size: 14.5px; text-align: center;
  }
  .datos-gr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
  .dato-gr b { display: block; font-size: 26px; line-height: 1.1; }
  .dato-gr span { font-size: 11.5px; color: var(--tenue); text-transform: uppercase; letter-spacing: .05em; }
  .delta { font-size: 13px; }
  .delta.sube { color: var(--verde); }
  .delta.baja { color: var(--rojo); }

  .chip {
    font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 999px;
    background: var(--card2); color: var(--tenue);
  }
  .chip.gol { background: var(--verde-suave); color: var(--verde); }
  .chip.am { background: var(--ambar-suave); color: var(--ambar); }
  .chip.roja { background: var(--rojo-suave); color: var(--rojo); }
  .min { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linea); font-size: 14.5px; }
  .min b { font-family: var(--num); font-size: 12px; color: var(--tenue); flex: none; padding-top: 2px; min-width: 26px; }

  /* --------------------------------------------------------------- listas */
  .fila-lista { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--linea); font-size: 14.5px; }
  .fila-lista:first-of-type { border-top: none; }
  .fila-lista .pos { font-family: var(--num); font-size: 13px; color: var(--tenue); width: 20px; flex: none; text-align: right; }
  .fila-lista .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila-lista .dato { font-family: var(--num); font-size: 13.5px; color: var(--tenue); flex: none; }
  .fila-lista .dato.fuerte { color: var(--texto); font-weight: 700; }
  .fila-lista.yo { background: var(--verde-suave); margin: 0 -8px; padding: 10px 8px; border-radius: 8px; border-top-color: transparent; }
  .fila-lista.yo .nom { font-weight: 700; color: var(--verde); }
  .zona { width: 3px; align-self: stretch; border-radius: 2px; flex: none; }
  .zona.sube { background: var(--verde); } .zona.baja { background: var(--rojo); }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--linea); font-size: 14.5px; }
  .kv:first-child { border-top: none; }
  .kv span { color: var(--tenue); }
  .kv b { font-family: var(--num); font-weight: 650; }

  .barra { margin-bottom: 12px; }
  .barra .lab { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .barra .lab b { font-family: var(--num); }
  .barra .riel { height: 6px; background: var(--linea); border-radius: 999px; overflow: hidden; }
  .barra .riel i { display: block; height: 100%; background: var(--verde); border-radius: 999px; }
  .barra.medio .riel i { background: var(--ambar); }
  .barra.mal .riel i { background: var(--rojo); }

  .feed .it { display: flex; gap: 9px; padding: 9px 0; border-top: 1px solid var(--linea); font-size: 14px; line-height: 1.4; }
  .feed .it:first-child { border-top: none; }
  .feed .t { font-family: var(--num); font-size: 11px; color: var(--tenue); flex: none; padding-top: 2px; }
  .feed .bueno { color: var(--verde); }
  .feed .malo { color: var(--rojo); }
  .feed .hito { font-weight: 650; }

  /* ----------------------------------------------------------- navegación */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--card); border-top: 1px solid var(--linea);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav .interior { max-width: 560px; margin: 0 auto; display: flex; }
  .nav button {
    flex: 1; height: var(--nav-h); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; font-weight: 600; color: var(--tenue);
  }
  .nav button .ico { font-size: 19px; line-height: 1; }
  .nav button.on { color: var(--verde); }

  @media (min-width: 760px) {
    body { padding-bottom: 24px; }
    .app { max-width: 620px; }
    .nav {
      position: sticky; top: 96px; border-top: none; border-bottom: 1px solid var(--linea);
      background: var(--bg); margin: 0 -14px; padding: 0 14px;
    }
    .nav .interior { max-width: none; padding: 0; gap: 4px; }
    .nav button { height: 46px; flex-direction: row; gap: 7px; font-size: 13.5px; border-radius: 10px; }
    .nav button.on { background: var(--verde-suave); }
    .nav button .ico { font-size: 15px; }
  }

  /* ---------------------------------------------------------------- inicio */
  .paises { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 260px; overflow-y: auto; padding-right: 4px; }
  .pais { display: flex; align-items: center; gap: 8px; border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 550; text-align: left; background: var(--card); }
  .pais.on { border-color: var(--verde); background: var(--verde-suave); color: var(--verde); }
  .pais .bandera { font-size: 18px; line-height: 1; }
  .marca { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin: 22px 0 2px; }
  .marca span { color: var(--verde); }
  .lead { color: var(--tenue); margin-bottom: 4px; }
  .fin-grande { font-size: 27px; font-weight: 800; line-height: 1.15; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="app">
    <header class="top" id="top" hidden></header>
    <!-- En el teléfono la navegación es fija abajo (sale del flujo); en
         pantalla grande se queda acá, justo debajo de la cabecera. -->
    <nav class="nav" id="nav" hidden><div class="interior"></div></nav>
    <main id="pantalla"></main>
  </div>

  <script src="mundo.js"></script>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="career.js"></script>
  <script src="camisetas.js"></script>
  <script src="app.js"></script>
</body>
</html>
